apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: failure-playground-backend:latest
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: failure-playground-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
